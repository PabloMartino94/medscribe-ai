# Render blueprint. One web service runs the Express API and serves the built
# frontend from the same origin, so there is no CORS to configure and the SPA
# talks to relative /api paths.
#
# Secrets are marked `sync: false`: Render prompts for them when the blueprint
# is first applied and never stores them in this repository.
#
# The free plan sleeps after 15 minutes of inactivity and the next request pays
# a cold start of roughly a minute. Switch `plan` to `starter` to keep it warm.
services:
  - type: web
    name: medscribe-ai
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

      # Transcription and note structuring. AI_PROVIDER picks which API the
      # key belongs to: "openai" or "gemini". The model defaults follow the
      # provider, so switching is a two-field change with no redeploy of code.
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false

      # Supabase — authentication, consultation storage, audio bucket.
      # The publishable key is safe to expose: it is served to the browser by
      # /api/config and grants nothing without a session, because every table
      # is behind row level security.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
